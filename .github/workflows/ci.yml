name: CI

# Build + smoke-test gate. Runs on every push/PR to main and on tag pushes so a
# release tag is only ever cut on a green commit. Note: jitpack.yml builds the
# published AAR with `-x test` — test enforcement lives here, not in the JitPack
# on-demand build.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build + smoke tests
        run: ./gradlew :DynamicLinks:testDebugUnitTest :DynamicLinks:assembleRelease --no-daemon
